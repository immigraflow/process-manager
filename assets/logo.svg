<svg width="220" height="56" viewBox="0 0 220 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ImmigraFlow">
  <defs>
    <linearGradient id="ifGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F5E52"/>
      <stop offset="100%" stop-color="#123B33"/>
    </linearGradient>
  </defs>
  <!-- Marca: caminho estilizado (trajetória/fluxo) dentro de um círculo -->
  <circle cx="26" cy="28" r="24" fill="url(#ifGrad)"/>
  <path d="M14 34 C 18 20, 24 20, 26 28 C 28 36, 34 36, 38 22"
        fill="none" stroke="#EDEEE9" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="38" cy="22" r="3.4" fill="#EDEEE9"/>

  <!-- Wordmark -->
  <text x="60" y="30" font-family="Lora, serif" font-weight="600" font-size="21" fill="#21252A">Immigra<tspan fill="#1F5E52">Flow</tspan></text>
  <text x="60" y="45" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="9.5" letter-spacing="1.5" fill="#63676D">GESTOR DE PROCESSOS</text>
</svg>
